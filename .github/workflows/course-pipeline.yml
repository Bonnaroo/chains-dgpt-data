# Weekly: every disc golf course OpenStreetMap knows about, merged into the catalog with provenance. No AI.
name: Course data pipeline
on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      region:
        description: "US, WORLD, or state list like MI,OH"
        default: "US"
permissions:
  contents: write
jobs:
  courses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect from OpenStreetMap
        run: python pipeline/collect_osm_courses.py "${{ github.event.inputs.region || 'US' }}"
      - name: Merge into the catalog
        run: python pipeline/merge_courses.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/courses.json data/sources data/geo/osm
          git diff --staged --quiet || git commit -m "Course pipeline (weekly): OSM → catalog"
          git push
