name: Live Poller (long-running)

# One job stays alive ~5.5h and refreshes Firebase /live every 25s
# (see poller_loop.py for why: the */5 cron workflows fired only 1-2x/hour
# during Worlds). Re-dispatches itself when the job ends; the hourly cron is a
# heartbeat in case a dispatch is lost. The concurrency group guarantees at
# most one is running at a time (extra triggers just queue behind it).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: live-poller
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll PDGA -> Firebase /live
        env:
          MAX_SECONDS: "19800"
          POLL_SECONDS: "25"
        run: python poller_loop.py

      # 2026-09-12: only chain the next run while an event is actually in its
      # date window. Outside events poller_loop exits after one cycle, and the
      # unconditional re-dispatch turned that into a 35-second loop that ran
      # around the clock all season (21,000+ runs). The hourly cron is the
      # heartbeat between events; the Railway poller covers /live anyway.
      - name: Still inside an event window?
        id: window
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import poller_loop
          print("live=" + ("true" if poller_loop.in_event_window() else "false"))
          PY

      - name: Re-dispatch the next run
        if: always() && steps.window.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run live_poller.yml --ref main || echo "dispatch failed (hourly cron will pick it up)"
